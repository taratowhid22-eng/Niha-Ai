name: NIHA AI Repository Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Diagnose Project Structure
        shell: bash
        run: |
          echo "========== REPOSITORY ROOT =========="
          pwd

          echo "========== BRANCH =========="
          git branch --show-current

          echo "========== ALL FILES =========="
          find . -not -path './.git/*' -type f | sort

          echo "========== GRADLEW SEARCH =========="
          find . -type f -name gradlew -print

          echo "========== SETTINGS SEARCH =========="
          find . -type f -name settings.gradle.kts -print

          echo "========== APP GRADLE SEARCH =========="
          find . -type f -path '*/app/build.gradle.kts' -print

          echo "========== TRACKED GRADLE FILES =========="
          git ls-files | grep -E '(^|/)(gradlew|settings.gradle.kts|build.gradle.kts)$' || true

          echo "========== DIAGNOSIS COMPLETE =========="
